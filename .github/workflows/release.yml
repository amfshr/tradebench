name: Release

# A release tag vX.Y.Z builds and tests the collector on a native ARM runner, then publishes its linux/arm64 image to
# GHCR under that tag (E1-T7, D34 R6). The tests run against the same ARM DuckDB jar the image ships.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+'] # the release tags deploy.sh accepts — vX.Y.Z only
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test on linux/arm64, with the platform's DuckDB jar
        run: ./gradlew build :market-data-service:installDist -PduckdbPlatform=linux_arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/market-data/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }} # only a pushed release tag publishes; a manual run builds and tests
          tags: |
            ghcr.io/amfshr/tradebench-market-data:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/amfshr/tradebench
            org.opencontainers.image.revision=${{ github.sha }}
