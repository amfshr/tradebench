# Builds the board-viewer (content snapshotted at build time) and deploys it to GitHub
# Pages on every main push that touches content or the app. One-off setup: repo Settings →
# Pages → Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'web/**'
      - '.claude/tasks/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test -w docs
        working-directory: web
      # Default base suits amfshr.github.io/tradebench/. A custom domain serves from the
      # root: set repo Actions variable PAGES_BASE=/ (Settings → Secrets and variables →
      # Actions → Variables) — no commit needed.
      - run: npm run build -w docs
        working-directory: web
        env:
          VITE_BASE: ${{ vars.PAGES_BASE || '/tradebench/' }}
      # SPA deep links: Pages serves 404.html for unknown paths — the app boots and routes.
      - run: cp web/docs/dist/index.html web/docs/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
