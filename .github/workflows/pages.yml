# Builds the board-viewer (content snapshotted at build time) and deploys it to GitHub
# Pages on every main push that touches content or the app. One-off setup: repo Settings →
# Pages → Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'frontend/**'
      - '.claude/tasks/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test -w board-viewer
        working-directory: frontend
      - run: npm run build -w board-viewer
        working-directory: frontend
        env:
          VITE_BASE: /tradebench/
      # SPA deep links: Pages serves 404.html for unknown paths — the app boots and routes.
      - run: cp frontend/board-viewer/dist/index.html frontend/board-viewer/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/board-viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
