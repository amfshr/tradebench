# PR lane for frontend/** — test + typecheck + build. Not a required check yet
# (protection requires the Java `build`); promote once E2 merges and proves stable.
name: frontend

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test -w board-viewer
        working-directory: frontend
      - run: npm run build -w board-viewer
        working-directory: frontend
