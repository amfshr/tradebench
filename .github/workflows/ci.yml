name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history: G1's scan covers every commit, not only the tip
      - name: G1 — gitleaks over the whole history, then its rules proven red (E0-T4)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks && rm gitleaks.tar.gz
          gitleaks git . --config .gitleaks.toml --redact --no-banner
          scripts/guardrails/guardrails-test.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - run: deploy/test/deploy-test.sh # deploy.sh's record keeping against stubbed tools
      - run: deploy/test/backup-test.sh # backup.sh's dump leaves the ticks to the archive (D39)
