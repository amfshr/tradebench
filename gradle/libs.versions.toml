[versions]
flyway = "13.8.0"
hikaricp = "7.1.0"
jspecify = "1.0.1"
lightstreamer = "5.3.3"
postgresql = "42.7.13"
testcontainers = "1.21.4"
junit = "6.1.3"
jackson = "2.22.3"
resilience4j = "2.4.0"
duckdb = "1.5.6.0"
awssdk = "2.56.0"
# the API the OpenTelemetry Java agent (2.32.0, deploy/market-data/Dockerfile) bridges; it bundles SDK 1.66.0
opentelemetry = "1.66.0"
# the SLF4J the libraries already bring (HikariCP, the AWS SDK); its JUL binding routes them to the agent
slf4j = "2.0.17"

[libraries]
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
duckdb-jdbc = { module = "org.duckdb:duckdb_jdbc", version.ref = "duckdb" }
awssdk-s3 = { module = "software.amazon.awssdk:s3", version.ref = "awssdk" }
awssdk-url-connection-client = { module = "software.amazon.awssdk:url-connection-client", version.ref = "awssdk" }
resilience4j-retry = { module = "io.github.resilience4j:resilience4j-retry", version.ref = "resilience4j" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
lightstreamer-client = { module = "com.lightstreamer:ls-javase-client", version.ref = "lightstreamer" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry" }
opentelemetry-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing", version.ref = "opentelemetry" }
slf4j-jdk14 = { module = "org.slf4j:slf4j-jdk14", version.ref = "slf4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
